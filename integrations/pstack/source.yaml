# pstack integration source manifest
# Generated by Aethra — do not edit manually; update via the integration process.

source:
  name: pstack
  upstream_url: https://github.com/cursor/plugins/tree/main/pstack
  repository_url: https://github.com/cursor/plugins
  subdirectory: pstack
  author: Lauren Tan (poteto)
  license: MIT
  version: 0.15.15
  # Reference commit should be pinned for reproducibility.
  # Value below is the latest known tag at import date.
  # TODO: replace with a pinned immutable commit SHA once confirmed.
  pinned_ref: "main (tag v0.15.15 — pin to commit SHA before production use)"

import:
  date: "2026-10-10"
  imported_by: Aethra Workbench (automated inventory)
  purpose: >
    Selectively adopt engineering principles and investigation practices that
    improve Aethra's delivery quality, without depending on pstack's runtime
    or Cursor-specific infrastructure.

attribution:
  required: true
  notice: >
    Engineering principles in this integration are adapted from pstack by Lauren Tan (poteto),
    licensed under MIT (https://github.com/cursor/plugins/blob/main/LICENSE).
    Original source: https://github.com/cursor/plugins/tree/main/pstack

dependencies:
  cursor_plugin_manifest: false # plugin.json not used
  cursor_model_routing: false # setup-pstack not used
  cursor_automations: false # Benny not used
  cursor_subagent_dispatch: false # agents/ not used
  slack_webhook: false
  tailscale: false

compatibility:
  claude_code: true
  cursor: partial # principles work; Cursor-specific components rejected
  other_agents: true # all adopted content is model-agnostic plain markdown

classifications:
  # Adopt: model-agnostic, directly usable without modification
  adopted:
    - principle-fix-root-causes
    - principle-prove-it-works
    - principle-test-behavior-not-implementation
    - principle-sequence-verifiable-units
    - principle-blast-radius
    - principle-foundational-thinking
    - principle-exhaust-the-design-space
    - principle-subtract-before-you-add
    - principle-make-operations-idempotent
    - principle-encode-lessons-in-structure
    - principle-type-system-discipline
    - principle-minimize-reader-load
    - principle-attack-the-premise
    - principle-explain-the-number
    - principle-outcome-oriented-execution
    - principle-boundary-discipline
    - principle-guard-the-context-window
    - principle-build-the-lever
    - principle-experience-first
    - principle-model-the-domain
    - principle-never-block-on-the-human
    - principle-redesign-from-first-principles
    - principle-separate-before-serializing-shared-state
    - principle-migrate-callers-then-delete-legacy-apis
    - principle-laziness-protocol
    - tdd
    - blast-radius
    - benchmark-checklist

  # Adapt: valuable concept, Cursor-specific wiring must be replaced
  adapted:
    - name: poteto-mode-playbooks
      note: >
        The 23 playbook concepts (investigation, planning, implementation, verification
        etc.) are adopted as the Aethra workflow model. The Cursor slash-command and
        option+enter wiring is not used. Aethra's CLI commands replace the invocation model.
    - name: how
      note: Concept adopted as `aethra investigate`. Agent reads knowledge base + evidence.
    - name: reflect
      note: Concept useful for the skill builder (Phase 6). Not yet implemented.
    - name: correct
      note: Concept useful for the feedback loop in skill evaluation. Deferred.
    - name: interrogate
      note: Useful for independent review agent (Phase 7). Not yet implemented.

  # Reference: useful inspiration, no direct implementation planned
  reference:
    - automate-me
    - recall
    - create-verification-skill
    - maintain-verification-skill
    - docs/guide # Good reading for Aethra skill authors

  # Reject: Cursor-specific, incompatible, or out of scope
  rejected:
    - name: setup-pstack
      reason: Writes to .cursor/settings.json — Cursor-only
    - name: make-bot-ui
      reason: Cursor + Grok Bot + Tailscale dependency — incompatible
    - name: automations/benny
      reason: Cursor Automations + Slack pipeline — out of scope
    - name: plugin.json
      reason: Cursor plugin manifest format — not applicable
    - name: agents/poteto-agent.md
      reason: Uses Cursor subagent_type dispatch — not applicable
    - name: agents/comment-sicko.md
      reason: Uses Cursor subagent_type dispatch — not applicable
    - name: unslop
      reason: Removes AI writing patterns — useful for prose review but not engineering delivery
    - name: no-comments
      reason: Too opinionated for client code — conflicts with some client style guides
    - name: arena
      reason: Multi-model parallel runs — Phase 7 concern; not needed for single-agent workflow
    - name: swarm
      reason: Parallel agent slicing — Phase 7 concern

local_adaptations:
  - source: "principle-* skills (20 files)"
    adapted_to: "templates/skills/engineering-principles.md"
    note: >
      The 20 principle files are consolidated into a single Aethra skill for
      efficiency. An agent doesn't need to load 20 separate files; the relevant
      principles are curated into a cohesive skill with full attribution.
      The most critical principles are marked with [PRIMARY].

upgrade_history:
  - date: 2026-10-10
    action: initial-import
    version: 0.15.15
    notes: First structured inventory. Principles adapted into engineering-principles skill.
