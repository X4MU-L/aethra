  repository_url: https://github.com/wheresryan22/anatomy
  author: wheresryan22
  license: MIT
  version: 1.0.0
  pinned_ref: "main" # pin to commit SHA before production use

import:
  date: "2026-10-11"
  imported_by: Aethra Workbench
  purpose: >
    Provide specialized illustration capability for technical explainers,
    architecture diagrams, and visual documentation within Aethra workflows.

attribution:
  required: true
  notice: >
    Engineering principles in this integration are adapted from pstack by Lauren Tan (poteto),
    licensed under MIT (https://github.com/wheresryan22/anatomy/blob/main/LICENSE).
